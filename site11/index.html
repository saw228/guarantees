<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Редактор перевода</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Tinkoff Sans';
      src: local('Tinkoff Sans Regular'), local('TinkoffSans-Regular'),
           url('assets/fonts/TinkoffSans-Regular.woff2') format('woff2'),
           url('assets/fonts/TinkoffSans-Regular.woff') format('woff'),
           url('assets/fonts/TinkoffSans-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Tinkoff Sans';
      src: local('Tinkoff Sans Medium'), local('TinkoffSans-Medium'),
           url('assets/fonts/TinkoffSans-Medium.woff2') format('woff2'),
           url('assets/fonts/TinkoffSans-Medium.woff') format('woff'),
           url('assets/fonts/TinkoffSans-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Tinkoff Sans';
      src: local('Tinkoff Sans Bold'), local('TinkoffSans-Bold'),
           url('assets/fonts/TinkoffSans-Bold.woff2') format('woff2'),
           url('assets/fonts/TinkoffSans-Bold.woff') format('woff'),
           url('assets/fonts/TinkoffSans-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      background: #111318;
      color: #fff;
      font-family: 'Tinkoff Sans', Arial, Helvetica, sans-serif;
    }

    .settings-panel {
      width: 330px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      padding: 22px;
      border-radius: 20px;
      background: #1b1e24;
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 22px 70px rgba(0,0,0,.4);
    }

    .settings-title {
      margin: 0 0 18px;
      font-size: 19px;
      font-weight: 700;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 14px;
    }

    .field[hidden] {
      display: none;
    }

    .field label {
      font-size: 12px;
      color: #aeb4c0;
    }

    .field input,
    .field select {
      width: 100%;
      height: 44px;
      padding: 0 13px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      outline: none;
      background: #252932;
      color: #fff;
      font-size: 14px;
    }

    .field input:focus,
    .field select:focus {
      border-color: #6674ff;
    }

    .saved-value-control {
      position: relative;
      width: 100%;
    }

    .saved-value-control input {
      display: block;
    }

    .saved-value-control.has-save-action input {
      padding-right: 48px;
    }

    .saved-value-save {
      position: absolute;
      z-index: 2;
      top: 50%;
      right: 9px;
      width: 25px;
      height: 25px;
      padding: 0;
      display: none;
      align-items: center;
      justify-content: center;
      transform: translateY(-50%);
      border: 0;
      border-radius: 7px;
      background: #6674ff;
      color: #fff;
      cursor: pointer;
      transition: background-color .16s ease, transform .16s ease;
    }

    .saved-value-save.is-visible {
      display: flex;
    }

    .saved-value-save:hover {
      background: #7783ff;
    }

    .saved-value-save:active {
      transform: translateY(-50%) scale(.94);
    }

    .saved-value-save:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    .saved-value-save svg {
      width: 15px;
      height: 15px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .saved-value-menu {
      position: absolute;
      z-index: 20;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      max-height: 190px;
      padding: 6px;
      display: none;
      overflow-y: auto;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px;
      background: #252932;
      box-shadow: 0 14px 34px rgba(0,0,0,.38);
    }

    .saved-value-menu.is-open {
      display: block;
    }

    .saved-value-option {
      width: 100%;
      min-height: 36px;
      padding: 8px 10px;
      border: 0;
      border-radius: 8px;
      display: block;
      overflow: hidden;
      background: transparent;
      color: #fff;
      font: inherit;
      font-size: 13px;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }

    .saved-value-option:hover,
    .saved-value-option:focus-visible {
      outline: none;
      background: rgba(102,116,255,.2);
    }

    .phone {
      position: relative;
      width: 375px;
      height: 812px;
      flex: 0 0 375px;
      overflow: hidden;
      background: #292929;
      box-shadow: 0 28px 80px rgba(0,0,0,.55);
    }

    .phone-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    .dim {
      display: none;
    }

    .transfer-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      color: #fff;
    }

    /* Верхняя системная строка */
    .status-bar {
      position: absolute;
      top: 17px;
      left: 24px;
      right: 22px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 700;
    }

    .status-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .signal {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
    }

    .signal i {
      display: block;
      width: 3px;
      background: #fff;
      border-radius: 2px;
    }

    .signal i:nth-child(1) { height: 5px; }
    .signal i:nth-child(2) { height: 8px; }
    .signal i:nth-child(3) { height: 11px; }
    .signal i:nth-child(4) { height: 14px; }

    .wifi {
      width: 17px;
      height: 13px;
      border-top: 3px solid #fff;
      border-radius: 50%;
      position: relative;
      transform: scaleX(1.15);
    }

    .wifi::before {
      content: "";
      position: absolute;
      left: 3px;
      right: 3px;
      top: 3px;
      height: 7px;
      border-top: 3px solid #fff;
      border-radius: 50%;
    }

    .wifi::after {
      content: "";
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #fff;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
    }

    .battery {
      position: relative;
      width: 25px;
      height: 13px;
      border: 1.6px solid rgba(255,255,255,.8);
      border-radius: 4px;
      padding: 2px;
    }

    .battery::after {
      content: "";
      position: absolute;
      right: -3.5px;
      top: 3px;
      width: 2px;
      height: 5px;
      border-radius: 0 2px 2px 0;
      background: rgba(255,255,255,.65);
    }

    .battery-fill {
      height: 100%;
      border-radius: 2px;
      background: #fff;
    }

    .tbank-pill {
      position: absolute;
      top: 7px;
      left: 50%;
      transform: translateX(-50%);
      min-width: 86px;
      height: 29px;
      padding: 0 12px;
      border-radius: 16px;
      background: #ffda2f;
      color: #171717;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: -.2px;
    }

    .screen-title {
      position: absolute;
      top: 59px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 17px;
      font-weight: 400;
    }

    .sbp-line {
      position: absolute;
      top: 91px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 13px;
      color: rgba(255,255,255,.62);
    }

    .account-name {
      position: absolute;
      top: 220px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 19px;
      font-weight: 400;
    }

    .balance-row {
      position: absolute;
      top: 250px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      font-size: 17px;
    }

    .old-balance {
      text-decoration: line-through;
      text-decoration-thickness: 1px;
    }

    .minus-amount {
      position: absolute;
      top: 275px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 34px;
      font-weight: 500;
      letter-spacing: .2px;
    }

    .recipient-card {
      position: absolute;
      top: 338px;
      left: 48px;
      width: 279px;
      height: 156px;
      overflow: visible;
      border-radius: 17px;
      background: #fff;
      box-shadow: 0 9px 28px rgba(0,0,0,.22);
    }

    .recipient-card-inner {
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 17px;
    }

    .recipient-card-top {
      height: 64px;
      background: var(--bank-color);
      color: var(--bank-text);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 11px;
      font-size: 18px;
      font-weight: 400;
    }

    .bank-logo {
      position: absolute;
      top: 35px;
      left: calc(50% - 32px);
      transform: none;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #fff;
      background: var(--bank-color);
      z-index: 3;
      isolation: isolate;
    }

    .recipient-card-bottom {
      height: 92px;
      padding-top: 43px;
      text-align: center;
      color: #242424;
    }

    .recipient-card-bottom .label {
      color: #9a9a9a;
      font-size: 13px;
      margin-bottom: 3px;
    }

    .recipient-card-bottom .value {
      font-size: 18px;
      letter-spacing: .2px;
    }

    .actions {
      position: absolute;
      top: 510px;
      left: 58px;
      right: 58px;
      display: flex;
      justify-content: space-between;
    }

    .action {
      width: 78px;
      text-align: center;
      font-size: 12px;
      line-height: 1.15;
      color: #fff;
    }

    .action-icon {
      width: 42px;
      height: 42px;
      margin: 0 auto 9px;
      overflow: hidden;
      border-radius: 50%;
      background: #378df0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .action-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 50%;
    }

    .done-button {
      position: absolute;
      left: 48px;
      right: 48px;
      bottom: 55px;
      height: 55px;
      border-radius: 15px;
      background: #ffdc2f;
      color: #292929;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 400;
      box-shadow: 0 4px 14px rgba(0,0,0,.14);
    }

    @media (max-width: 760px) {
      body {
        align-items: flex-start;
        justify-content: flex-start;
        overflow-x: auto;
        gap: 24px;
      }
      .settings-panel { flex: 0 0 300px; }
    }
  
    /* ===== ХЕДЕР, ПОЛНОСТЬЮ ПЕРЕНЕСЁННЫЙ ИЗ ПРИСЛАННОГО ФАЙЛА ===== */
    .source-phone-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px 6px;
      z-index: 5;
      font-family: 'Tinkoff Sans', -apple-system, 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-synthesis: none;
    }

    .source-header-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .source-time {
      font-size: 17px;
      font-weight: 400;
      letter-spacing: -0.3px;
      color: #fff;
      margin-left: 10px;
    }

    .source-header-right {
      display: flex;
      align-items: center;

      gap: 3px;
    }

    .source-signal {
      display: flex;
      align-items: flex-end;
      gap: 1.5px;
      height: 12px;
    }

    .source-signal span:nth-child(1) {
      width: 3px;
      height: 4px;
      background: #fff;
      border-radius: 1px;
      opacity: 0.4;
    }

    .source-signal span:nth-child(2) {
      width: 3px;
      height: 6px;
      background: #fff;
      border-radius: 1px;
      opacity: 0.7;
    }

    .source-signal span:nth-child(3) {
      width: 3px;
      height: 9px;
      background: #fff;
      border-radius: 1px;
    }

    .source-signal span:nth-child(4) {
      width: 3px;
      height: 12px;
      background: #fff;
      border-radius: 1px;
    }

    .source-battery-detailed {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .source-battery-number {
      font-size: 13px;
      font-weight: 500;
      color: #fff;
    }

    .source-battery-shell {
      position: relative;
      width: 25px;
      height: 13px;
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      border-radius: 3px;
    }

    .source-battery-cap {
      position: absolute;
      right: -4px;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 6px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 0 2px 2px 0;
    }

    .source-battery-level {
      position: absolute;
      inset: 1px;
      width: calc(50% - 2px);
      background: #fff;
      border-radius: 1.5px;
    }

    .source-battery-simple {
      display: none;
      width: 25px;
      height: 13px;
      margin-top: 3px;
    }

    .source-battery-simple svg {
      display: block;
      width: 25px;
      height: 13px;
    }

    .header-controls-source {
      margin-bottom: 14px;
    }

    .source-control-label {
      font-size: 12px;
      color: #aeb4c0;
      margin-bottom: 7px;
    }

    .source-battery-range {
      width: 100%;
      cursor: pointer;
      accent-color: #6674ff;
    }


    #copy-btn {
      width: 100%;
      height: 44px;
      border: none;
      border-radius: 14px;
      background: #ffffff;
      color: #111318;
      font-size: 14px;
      font-weight: 700;
      font-family: 'Tinkoff Sans', Arial, Helvetica, sans-serif;
      cursor: pointer;
      margin-top: 4px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      transition: 0.2s ease;
    }

    #copy-btn:hover {
      background: #e9ecf1;
      transform: translateY(-1px);
    }

    #copy-btn:active {
      transform: scale(0.98);
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.25);
    }


    /* ===== ШРИФТЫ БЕЗ ИЗМЕНЕНИЯ ВЁРСТКИ ===== */
    .phone,
    .transfer-overlay,
    .source-phone-header {
      font-family: 'Roboto', Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      font-synthesis: none;
      font-kerning: normal;
    }

    .source-time {
      font-family: 'Roboto', Arial, sans-serif;
      font-weight: 500;
      letter-spacing: -0.25px;
      font-variant-numeric: proportional-nums;
    }

    .source-battery-number {
      font-family: 'Roboto', Arial, sans-serif;
      font-weight: 500;
      letter-spacing: -0.15px;
      font-variant-numeric: proportional-nums;
    }

    .screen-title {
      font-family: 'Roboto', Arial, sans-serif;
      font-weight: 400;
      letter-spacing: -0.2px;
    }

    .sbp-line {
      font-family: 'Roboto', Arial, sans-serif;
      font-weight: 400;
      letter-spacing: -0.12px;
    }

    .account-name {
      font-family: 'Roboto', Arial, sans-serif;
      font-weight: 400;
      letter-spacing: -0.25px;
    }

    .balance-row {
      font-family: 'Roboto', Arial, sans-serif;
      font-weight: 400;
      letter-spacing: -0.15px;
      font-variant-numeric: proportional-nums;
    }

    .old-balance {
      text-decoration-thickness: 1px;
      text-decoration-skip-ink: none;
    }

    .balance-arrow {
      font-family: 'Roboto', Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 0;
    }

    .minus-amount {
      font-family: 'Roboto', Arial, sans-serif;
      font-weight: 500;
      letter-spacing: -0.55px;
      font-variant-numeric: proportional-nums;
    }

    .recipient-card-top {
      font-family: 'Roboto', Arial, sans-serif;
      font-weight: 400;
      letter-spacing: -0.18px;
    }

    .recipient-card-bottom .label {
      font-family: 'Roboto', Arial, sans-serif;
      font-weight: 400;
      letter-spacing: -0.08px;
    }

    .recipient-card-bottom .value {
      font-family: 'Roboto', Arial, sans-serif;
      font-weight: 400;
      letter-spacing: -0.18px;
      font-variant-numeric: proportional-nums;
    }

    .action {
      font-family: 'Roboto', Arial, sans-serif;
      font-weight: 400;
      letter-spacing: -0.08px;
    }


    .bank-icons-box {
      margin-top: 2px;
      margin-bottom: 14px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255,255,255,.025);
    }

    .bank-icons-box summary {
      height: 44px;
      padding: 0 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      list-style: none;
      user-select: none;
    }

    .bank-icons-box summary::-webkit-details-marker {
      display: none;
    }

    .bank-icons-box summary::after {
      content: "⌄";
      color: #8f96a3;
      font-size: 17px;
      transition: transform .18s ease;
    }

    .bank-icons-box[open] summary::after {
      transform: rotate(180deg);
    }

    .bank-icons-content {
      padding: 0 12px 12px;
    }

    .bank-icon-field {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 9px;
      align-items: center;
      margin-top: 10px;
    }

    .bank-icon-preview {
      width: 42px;
      height: 42px;
      overflow: hidden;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.1);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #252932;
    }

    .bank-icon-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .bank-icon-preview span {
      font-size: 10px;
      color: #8f96a3;
    }

    .bank-icon-input-wrap label {
      display: block;
      margin-bottom: 5px;
      color: #aeb4c0;
      font-size: 11px;
    }

    .bank-icon-input {
      width: 100%;
      height: 38px;
      padding: 0 10px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 10px;
      outline: none;
      background: #252932;
      color: #fff;
      font-size: 12px;
    }

    .bank-icon-input:focus {
      border-color: #6674ff;
    }

    .bank-icons-hint {
      margin-top: 10px;
      color: #7f8795;
      font-size: 10px;
      line-height: 1.35;
    }

    .bank-logo img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: none;
      border-radius: 50%;
      transform: none;
    }

  </style>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
  <aside class="settings-panel">
    <h1 class="settings-title">Данные перевода</h1>

    <div class="field">
      <label for="timeInput">Время</label>
      <input id="timeInput" type="time" value="15:17">
    </div>

    <div class="header-controls-source">
      <div class="source-control-label">Заряд батареи</div>
      <input class="source-battery-range" type="range" min="0" max="100" value="50" id="batteryInput">
    </div>

    <div class="field">
      <label for="balanceInput">Баланс до перевода</label>
      <input id="balanceInput" type="text" value="55 994,10">
    </div>

    <div class="field">
      <label for="amountInput">Сумма перевода</label>
      <input id="amountInput" type="text" value="5 050">
    </div>

    <div class="field">
      <label for="accountInput">Название счёта</label>
      <input id="accountInput" type="text" value="Платинум">
    </div>

    <div class="field">
      <label for="nameInput">Имя получателя</label>
      <input id="nameInput" type="text" value="Александр К.">
    </div>

  <script>

    function waitForImage(image) {
      if (image.complete && image.naturalWidth > 0) {
        return Promise.resolve();
      }

      return new Promise((resolve, reject) => {
        image.addEventListener("load", resolve, { once: true });
        image.addEventListener("error", reject, { once: true });
      });
    }

    async function prepareBlurredBackgroundForCapture() {
      return null;
    }


    async function prepareBankLogoForCapture() {
      const logo = document.getElementById('bankLogo');
      const image = document.getElementById('bankLogoImage');
      const card = document.getElementById('recipientCard');

      if (!logo || !image || !card) return null;
      if (getComputedStyle(image).display === 'none' || !image.src) return null;

      try {
        await waitForImage(image);

        const canvas = document.createElement('canvas');
        const size = 128;
        const border = 6;
        const innerSize = size - border * 2;

        canvas.width = size;
        canvas.height = size;

        const ctx = canvas.getContext('2d');
        if (!ctx) return null;

        const bankColor = getComputedStyle(card)
          .getPropertyValue('--bank-color')
          .trim() || '#ffffff';

        ctx.clearRect(0, 0, size, size);

        ctx.save();
        ctx.beginPath();
        ctx.arc(size / 2, size / 2, innerSize / 2, 0, Math.PI * 2);
        ctx.clip();

        ctx.fillStyle = bankColor;
        ctx.fillRect(border, border, innerSize, innerSize);

        const naturalWidth = image.naturalWidth || 1;
        const naturalHeight = image.naturalHeight || 1;
        const scale = Math.max(innerSize / naturalWidth, innerSize / naturalHeight);
        const drawWidth = naturalWidth * scale;
        const drawHeight = naturalHeight * scale;

        ctx.drawImage(
          image,
          (size - drawWidth) / 2,
          (size - drawHeight) / 2,
          drawWidth,
          drawHeight
        );

        ctx.restore();

        ctx.beginPath();
        ctx.arc(size / 2, size / 2, size / 2 - border / 2, 0, Math.PI * 2);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = border;
        ctx.stroke();

        const temporaryImage = document.createElement('img');
        temporaryImage.src = canvas.toDataURL('image/png');
        temporaryImage.alt = '';
        temporaryImage.style.cssText = [
          'position:absolute',
          'top:35px',
          'left:calc(50% - 32px)',
          'width:64px',
          'height:64px',
          'display:block',
          'z-index:4',
          'pointer-events:none'
        ].join(';');

        logo.style.visibility = 'hidden';
        card.appendChild(temporaryImage);
        await waitForImage(temporaryImage);

        return () => {
          temporaryImage.remove();
          logo.style.visibility = '';
        };
      } catch (error) {
        console.warn('Не удалось подготовить аватар банка для PNG', error);
        return null;
      }
    }

    async function prepareFilteredImagesForCapture() {
      const images = Array.from(document.querySelectorAll('.phone img'));
      const restoreActions = [];

      for (const image of images) {
        const computed = getComputedStyle(image);
        const inlineFilter = image.style.filter || '';
        const activeFilter = computed.filter || inlineFilter || '';

        // html2canvas часто не переносит CSS filter на img.
        // Для wifi-иконки с brightness(0) invert(1) запекаем белый вариант прямо в src.
        if (!activeFilter || activeFilter === 'none') continue;
        if (!/invert|brightness|contrast/i.test(activeFilter)) continue;

        await waitForImage(image);

        const canvas = document.createElement('canvas');
        canvas.width = image.naturalWidth || Math.max(1, image.width);
        canvas.height = image.naturalHeight || Math.max(1, image.height);

        const ctx = canvas.getContext('2d');
        if (!ctx) continue;

        ctx.drawImage(image, 0, 0, canvas.width, canvas.height);

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;

        // Делаем непрозрачные пиксели белыми, сохраняя альфу.
        for (let i = 0; i < data.length; i += 4) {
          const alpha = data[i + 3];
          if (alpha > 0) {
            data[i] = 255;
            data[i + 1] = 255;
            data[i + 2] = 255;
          }
        }

        ctx.putImageData(imgData, 0, 0);

        const originalSrc = image.src;
        const originalFilter = image.style.filter;

        image.src = canvas.toDataURL('image/png');
        image.style.filter = 'none';
        await waitForImage(image);

        restoreActions.push(() => {
          image.src = originalSrc;
          image.style.filter = originalFilter;
        });
      }

      return () => {
        for (const restore of restoreActions) restore();
      };
    }

    document.getElementById("copy-btn").addEventListener("click", async () => {
      const screen = document.querySelector(".phone");
      const button = document.getElementById("copy-btn");

      const originalShadow = screen.style.boxShadow;
      screen.style.boxShadow = "none";

      let restoreBackground = null;
      let restoreFilteredImages = null;
      let restoreBankLogo = null;

      try {
        if (document.fonts) {
          await Promise.all([
            document.fonts.load('400 19px "Roboto"'),
            document.fonts.load('500 34px "Roboto"'),
            document.fonts.load('500 17px "Roboto"'),
            document.fonts.ready
          ]);
        }

        restoreBackground = await prepareBlurredBackgroundForCapture();
        restoreFilteredImages = await prepareFilteredImagesForCapture();
        restoreBankLogo = await prepareBankLogoForCapture();
        await new Promise(resolve => setTimeout(resolve, 70));

        const canvas = await html2canvas(screen, {
          width: 375,
          height: 812,
          scale: 2,
          useCORS: true,
          allowTaint: true,
          backgroundColor: "#292929",
          logging: false
        });

        const blob = await new Promise((resolve, reject) => {
          canvas.toBlob(result => {
            if (result) resolve(result);
            else reject(new Error("Не удалось создать PNG"));
          }, "image/png");
        });

        try {
          await navigator.clipboard.write([
            new ClipboardItem({ "image/png": blob })
          ]);

          button.textContent = "Скопировано";
        } catch {
          const link = document.createElement("a");
          link.download = "screen.png";
          link.href = canvas.toDataURL("image/png");
          document.body.appendChild(link);
          link.click();
          link.remove();

          button.textContent = "PNG сохранён";
        }
      } catch (error) {
        console.error(error);
        button.textContent = "Ошибка создания";
      } finally {
        if (restoreBankLogo) restoreBankLogo();
        if (restoreBackground) restoreBackground();
        if (restoreFilteredImages) restoreFilteredImages();
        screen.style.boxShadow = originalShadow;

        setTimeout(() => {
          button.textContent = "Скопировать";
        }, 2000);
      }
    });


    /*
      СЮДА ТОЖЕ МОЖНО ВСТАВИТЬ ИКОНКИ ВРУЧНУЮ.
      Пример: icon: 'source/alfa.png'
      Значения из панели управления сохраняются поверх этого объекта.
    */
    const banks = {
      ozon:   { color: '#005dff', text: '#fff',    icon: 'source/ozon.jpg' },
      tbank:  { color: '#ffda2f', text: '#252525', icon: 'source/tbank.png' },
      alfa:   { color: '#ef3123', text: '#fff',    icon: 'source/alfa.png' },
      yandex: { color: '#ff3a22', text: '#fff',    icon: 'source/yandex.png' },
      wb:     { color: '#ff16c5', text: '#fff',    icon: 'source/wb2.png' },
      psb:    { color: '#272a89', text: '#fff',    icon: 'source/psb.jpg' },
      sber:   { color: '#21a038', text: '#fff',    icon: 'source/sber2.png' },
      vtb:    { color: '#0a2896', text: '#fff',    icon: 'source/vtb2.png' },
      gaz:   { color: '#224f78', text: '#fff',    icon: 'source/gaz2.png' }
    };

    const bankIconsStorageKey = 'transferBankIconsV1';

    function loadSavedBankIcons() {
      try {
        const saved = JSON.parse(localStorage.getItem(bankIconsStorageKey));
        if (!saved || typeof saved !== 'object') return;

        Object.keys(banks).forEach(key => {
          if (typeof saved[key] === 'string' && saved[key].trim()) {
            banks[key].icon = saved[key].trim();
          }
        });
      } catch (error) {
        console.warn('Не удалось загрузить иконки банков', error);
      }
    }

    function saveBankIcons() {
      const icons = {};
      Object.keys(banks).forEach(key => {
        icons[key] = banks[key].icon || '';
      });
      localStorage.setItem(bankIconsStorageKey, JSON.stringify(icons));
    }

    loadSavedBankIcons();

    const timeInput = document.getElementById('timeInput');
    const batteryInput = document.getElementById('batteryInput');
    const balanceInput = document.getElementById('balanceInput');
    const amountInput = document.getElementById('amountInput');
    const accountInput = document.getElementById('accountInput');
    const nameInput = document.getElementById('nameInput');
    const recipientTypeSelect = document.getElementById('recipientTypeSelect');
    const phoneField = document.getElementById('phoneField');
    const phoneInput = document.getElementById('phoneInput');
    const cardField = document.getElementById('cardField');
    const cardInput = document.getElementById('cardInput');
    const bankSelect = document.getElementById('bankSelect');
    const bankLogo = document.getElementById('bankLogo');
    const bankLogoImage = document.getElementById('bankLogoImage');
    const bankIconInputs = document.querySelectorAll('[data-bank-icon]');

    const timeOutput = document.getElementById('timeOutput');
    const batteryFill = document.getElementById('batteryFill');
    const batteryPercentOutput = document.getElementById('batteryPercentOutput');
    const batteryDetailed = document.getElementById('batteryDetailed');
    const batterySimple = document.getElementById('batterySimple');
    const simpleBatteryLevel = document.getElementById('simpleBatteryLevel');
    const oldBalanceOutput = document.getElementById('oldBalanceOutput');
    const newBalanceOutput = document.getElementById('newBalanceOutput');
    const minusAmountOutput = document.getElementById('minusAmountOutput');
    const accountOutput = document.getElementById('accountOutput');
    const recipientNameOutput = document.getElementById('recipientNameOutput');
    const recipientDestinationLabel = document.getElementById('recipientDestinationLabel');
    const phoneOutput = document.getElementById('phoneOutput');
    const recipientCard = document.getElementById('recipientCard');

    function parseMoney(value) {
      return Number(value.replace(/\s/g, '').replace(',', '.').replace(/[^\d.]/g, '')) || 0;
    }

    function formatMoney(value, decimals = 2) {
      return new Intl.NumberFormat('ru-RU', {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      }).format(value);
    }

    function formatAmountInput(value) {
      const digits = value.replace(/\D/g, '');
      return digits.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    }

    function formatBalanceInput(value) {
      let cleaned = value.replace(/[^\d,.]/g, '').replace('.', ',');
      const parts = cleaned.split(',');
      const integer = (parts[0] || '').replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
      const decimals = parts.length > 1 ? ',' + parts.slice(1).join('').slice(0, 2) : '';
      return integer + decimals;
    }

    function formatPhone(value) {
      let digits = String(value || '').replace(/\D/g, '');

      // При вставке номера с +7 или 8 убираем код страны,
      // потому что он уже добавляется маской автоматически.
      if (digits.startsWith('7') || digits.startsWith('8')) {
        digits = digits.slice(1);
      }

      digits = digits.slice(0, 10);

      let result = '+7';

      if (digits.length > 0) {
        result += ' (' + digits.slice(0, 3);
      }

      if (digits.length >= 3) {
        result += ')';
      }

      if (digits.length > 3) {
        result += ' ' + digits.slice(3, 6);
      }

      if (digits.length > 6) {
        result += '-' + digits.slice(6, 8);
      }

      if (digits.length > 8) {
        result += '-' + digits.slice(8, 10);
      }

      return result;
    }

    function formatCard(value) {
      const digits = String(value || '').replace(/\D/g, '').slice(0, 16);
      return digits.replace(/(\d{4})(?=\d)/g, '$1 ');
    }

    function maskCard(value) {
      const digits = String(value || '').replace(/\D/g, '').slice(0, 16);
      if (digits.length <= 10) return digits;

      return digits.slice(0, 6)
        + '*'.repeat(digits.length - 10)
        + digits.slice(-4);
    }

    function updateMoney() {
      balanceInput.value = formatBalanceInput(balanceInput.value);
      amountInput.value = formatAmountInput(amountInput.value);

      const balance = parseMoney(balanceInput.value);
      const amount = parseMoney(amountInput.value);
      const result = Math.max(0, balance - amount);

      oldBalanceOutput.textContent = formatMoney(balance) + ' ₽';
      newBalanceOutput.textContent = formatMoney(result) + ' ₽';
      minusAmountOutput.textContent = '−' + formatMoney(amount, 0) + ' ₽';
    }

    function updateText() {
      accountOutput.textContent = accountInput.value || '';
      recipientNameOutput.textContent = nameInput.value || '';
    }

    function updatePhone() {
      const formattedPhone = formatPhone(phoneInput.value);
      phoneInput.value = formattedPhone;
      updateRecipientDestination();

      requestAnimationFrame(() => {
        const end = phoneInput.value.length;
        phoneInput.setSelectionRange(end, end);
      });
    }

    function updateCard() {
      cardInput.value = formatCard(cardInput.value);
      updateRecipientDestination();

      requestAnimationFrame(() => {
        const end = cardInput.value.length;
        cardInput.setSelectionRange(end, end);
      });
    }

    function updateRecipientDestination() {
      const isCardTransfer = recipientTypeSelect.value === 'card';
      phoneField.hidden = isCardTransfer;
      cardField.hidden = !isCardTransfer;
      recipientDestinationLabel.textContent = isCardTransfer ? 'На карту' : 'По номеру телефона';
      phoneOutput.textContent = isCardTransfer ? maskCard(cardInput.value) : phoneInput.value;
    }

    function setPreviewImage(bankKey, iconUrl) {
      const row = document.querySelector(`[data-bank-icon-row="${bankKey}"]`);
      if (!row) return;

      const preview = row.querySelector('.bank-icon-preview img');
      const fallback = row.querySelector('.bank-icon-preview span');

      if (!iconUrl) {
        preview.removeAttribute('src');
        preview.style.display = 'none';
        fallback.style.display = '';
        return;
      }

      preview.onload = () => {
        preview.style.display = 'block';
        fallback.style.display = 'none';
      };

      preview.onerror = () => {
        preview.style.display = 'none';
        fallback.style.display = '';
      };

      preview.src = iconUrl;
    }

    function updateBankIconInputs() {
      bankIconInputs.forEach(input => {
        const bankKey = input.dataset.bankIcon;
        input.value = banks[bankKey].icon || '';
        setPreviewImage(bankKey, banks[bankKey].icon || '');
      });
    }

    function updateBank() {
      const bank = banks[bankSelect.value];
      recipientCard.style.setProperty('--bank-color', bank.color);
      recipientCard.style.setProperty('--bank-text', bank.text);

      if (bank.icon) {
        bankLogoImage.onload = () => {
          bankLogoImage.style.display = 'block';
        };

        bankLogoImage.onerror = () => {
          bankLogoImage.style.display = 'none';
        };

        bankLogoImage.src = bank.icon;
      } else {
        bankLogoImage.removeAttribute('src');
        bankLogoImage.style.display = 'none';
      }
    }

    bankIconInputs.forEach(input => {
      input.addEventListener('input', () => {
        const bankKey = input.dataset.bankIcon;
        banks[bankKey].icon = input.value.trim();

        setPreviewImage(bankKey, banks[bankKey].icon);
        saveBankIcons();

        if (bankSelect.value === bankKey) {
          updateBank();
        }
      });
    });

    function updateStatus() {
      const level = Number(batteryInput.value) || 0;
      timeOutput.textContent = timeInput.value || '';

      batteryPercentOutput.textContent = level;
      batteryFill.style.width = `calc(${level}% - 2px)`;
      batteryFill.style.background = level < 20 ? '#ff3b30' : '#fff';

      simpleBatteryLevel.setAttribute('width', (level / 100) * 84);
      simpleBatteryLevel.setAttribute('fill', level < 20 ? '#ff3b30' : '#fff');

      batteryDetailed.style.display = 'none';
      batterySimple.style.display = 'block';
    }

    timeInput.addEventListener('input', updateStatus);
    batteryInput.addEventListener('input', updateStatus);
    balanceInput.addEventListener('input', updateMoney);
    amountInput.addEventListener('input', updateMoney);
    accountInput.addEventListener('input', updateText);
    nameInput.addEventListener('input', updateText);
    phoneInput.addEventListener('input', updatePhone);
    cardInput.addEventListener('input', updateCard);
    recipientTypeSelect.addEventListener('change', updateRecipientDestination);
    bankSelect.addEventListener('change', updateBank);

    const savedInputValuesStorageKey = 'transferInputValuesV1';
    const savedValueInputs = [
      timeInput,
      balanceInput,
      amountInput,
      accountInput,
      nameInput,
      phoneInput,
      cardInput
    ];

    function loadSavedInputValues() {
      try {
        const saved = JSON.parse(localStorage.getItem(savedInputValuesStorageKey));
        return saved && typeof saved === 'object' && !Array.isArray(saved) ? saved : {};
      } catch (error) {
        console.warn('Не удалось загрузить сохранённые значения полей', error);
        return {};
      }
    }

    const savedInputValues = loadSavedInputValues();

    function getSavedValues(input) {
      const values = savedInputValues[input.id];
      return Array.isArray(values)
        ? values.filter(value => typeof value === 'string' && value.trim())
        : [];
    }

    function saveInputValues() {
      try {
        localStorage.setItem(savedInputValuesStorageKey, JSON.stringify(savedInputValues));
      } catch (error) {
        console.warn('Не удалось сохранить значения полей', error);
      }
    }

    function initSavedValueControl(input) {
      const control = document.createElement('div');
      control.className = 'saved-value-control';

      const saveButton = document.createElement('button');
      saveButton.type = 'button';
      saveButton.className = 'saved-value-save';
      saveButton.setAttribute('aria-label', 'Сохранить это значение');
      saveButton.title = 'Сохранить значение';
      saveButton.innerHTML = `
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 4h11l3 3v13H5z"></path>
          <path d="M8 4v6h8V4M8 20v-6h8v6"></path>
        </svg>
      `;

      const menu = document.createElement('div');
      menu.className = 'saved-value-menu';
      menu.setAttribute('role', 'listbox');
      menu.setAttribute('aria-label', 'Сохранённые значения');

      input.parentNode.insertBefore(control, input);
      control.append(input, saveButton, menu);
      input.setAttribute('autocomplete', 'off');

      function currentValue() {
        return input.value.trim();
      }

      function closeMenu() {
        menu.classList.remove('is-open');
        input.setAttribute('aria-expanded', 'false');
      }

      function renderMenu() {
        menu.replaceChildren();
        const values = getSavedValues(input);

        values.forEach(value => {
          const option = document.createElement('button');
          option.type = 'button';
          option.className = 'saved-value-option';
          option.textContent = value;
          option.title = value;
          option.setAttribute('role', 'option');

          option.addEventListener('mousedown', event => event.preventDefault());
          option.addEventListener('click', () => {
            input.value = value;
            input.dispatchEvent(new Event('input', { bubbles: true }));
            closeMenu();
            input.focus();
          });

          menu.appendChild(option);
        });

        return values.length > 0;
      }

      function openMenu() {
        if (!renderMenu()) {
          closeMenu();
          return;
        }

        menu.classList.add('is-open');
        input.setAttribute('aria-expanded', 'true');
      }

      function updateSaveButton() {
        const value = currentValue();
        const isUnknown = value && !getSavedValues(input).includes(value);
        saveButton.classList.toggle('is-visible', Boolean(isUnknown));
        control.classList.toggle('has-save-action', Boolean(isUnknown));
      }

      input.setAttribute('aria-haspopup', 'listbox');
      input.setAttribute('aria-expanded', 'false');

      input.addEventListener('focus', openMenu);
      input.addEventListener('click', openMenu);
      input.addEventListener('input', updateSaveButton);
      input.addEventListener('keydown', event => {
        if (event.key === 'Escape') closeMenu();
      });

      saveButton.addEventListener('mousedown', event => event.preventDefault());
      saveButton.addEventListener('click', () => {
        const value = currentValue();
        if (!value) return;

        const values = getSavedValues(input).filter(savedValue => savedValue !== value);
        savedInputValues[input.id] = [value, ...values];
        saveInputValues();
        updateSaveButton();
        renderMenu();
        closeMenu();
        input.focus();
      });

      document.addEventListener('pointerdown', event => {
        if (!control.contains(event.target)) closeMenu();
      });

      updateSaveButton();
    }

    updateStatus();
    updateMoney();
    updateText();
    updatePhone();
    updateCard();
    updateBankIconInputs();
    updateBank();
    savedValueInputs.forEach(initSavedValueControl);
  </script>
