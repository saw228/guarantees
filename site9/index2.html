<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <title>Генератор экрана операций</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --screen-width: 574px;
      --screen-height: 1280px;
      --preview-scale: .5;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      background: linear-gradient(180deg, #232526, #414345);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .workspace {
      width: min(1450px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 340px auto;
      gap: 52px;
      align-items: start;
      justify-content: center;
    }

    .control-panel {
      width: 340px;
      max-height: calc(100vh - 48px);
      overflow-y: auto;
      padding: 20px;
      background: linear-gradient(145deg, #2d2d2d, #191919);
      border: 1px solid #404040;
      border-radius: 16px;
      box-shadow: 0 10px 34px rgba(0,0,0,.35);
      color: #ececec;
      transition: width .25s ease;
    }

    .workspace.custom-mode {
      grid-template-columns: 540px auto;
    }

    .workspace.custom-mode .control-panel {
      width: 540px;
    }

    .panel-title {
      margin: 0 0 18px;
      font-size: 18px;
      font-weight: 500;
      text-align: center;
    }

    .section {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-top: 17px;
      padding-top: 15px;
      border-top: 1px solid #3c3c3c;
    }

    .section:first-of-type {
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
    }

    .section-title {
      margin: 0;
      color: #a8a8a8;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field label {
      color: #bdbdbd;
      font-size: 12px;
    }

    .input,
    .select {
      width: 100%;
      height: 39px;
      padding: 9px 12px;
      border: 1px solid #4a4a4a;
      border-radius: 8px;
      outline: none;
      background: #282828;
      color: #eee;
      font: inherit;
      font-size: 13px;
    }

    .input:focus,
    .select:focus {
      border-color: #727272;
      box-shadow: 0 0 0 3px rgba(255,255,255,.07);
    }

    .button {
      min-height: 39px;
      padding: 9px 13px;
      border: 1px solid #4a4a4a;
      border-radius: 8px;
      background: linear-gradient(145deg, #3a3a3a, #292929);
      color: #eee;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .button:hover {
      background: linear-gradient(145deg, #4a4a4a, #353535);
    }

    .button.primary {
      border-color: #e5e5e5;
      background: #e5e5e5;
      color: #1f1f1f;
    }

    .button.danger {
      color: #ff8a8a;
    }

    .template-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .template-item {
      display: grid;
      grid-template-columns: 1fr 36px;
      gap: 6px;
    }

    .switch-line {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }

    .switch-line input {
      width: 18px;
      height: 18px;
      accent-color: #579df5;
    }

    .switch-line span {
      font-size: 14px;
      font-weight: 600;
    }

    .custom-editor {
      display: none;
    }

    .custom-mode .custom-editor {
      display: block;
    }

    .transaction-editor {
      padding: 12px;
      border: 1px solid #444;
      border-radius: 10px;
      background: #202020;
      margin-top: 9px;
    }

    .transaction-editor-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 9px;
    }

    .transaction-editor-title {
      font-size: 13px;
      font-weight: 700;
    }

    .mini-actions {
      display: flex;
      gap: 5px;
    }

    .mini-button {
      width: 29px;
      height: 29px;
      border: 1px solid #4a4a4a;
      border-radius: 7px;
      background: #2b2b2b;
      color: #ddd;
      cursor: pointer;
    }

    .avatar-upload {
      font-size: 11px;
      color: #aaa;
    }

    .preview-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .preview-wrapper {
      width: calc(var(--screen-width) * var(--preview-scale));
      height: calc(var(--screen-height) * var(--preview-scale));
    }

    .phone-screen {
      position: relative;
      width: var(--screen-width);
      height: var(--screen-height);
      overflow: hidden;
      background: #111;
      color: #f4f4f4;
      font-family: "Roboto", "Segoe UI", Arial, sans-serif;
      font-synthesis: none;
    }

    .screen-preview {
      transform: scale(var(--preview-scale));
      transform-origin: top left;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .screen-export {
      position: fixed;
      left: -9999px;
      top: 0;
    }

    
    .status-bar {
      width: 574px;
      height: 43px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 31px;
      color: #f2f2f2;
      background: #111;
      font-family: "Roboto", "Segoe UI", Arial, sans-serif;
      line-height: 1;
    }

    .status-left,
    .status-right {
      display: flex;
      align-items: center;
    }

    .status-left {
      gap: 7px;
    }

    .status-right {
      gap: 7px;
    }

    .status-time {
      min-width: 53px;
      font-size: 23px;
      font-weight: 400;
      letter-spacing: -.4px;
    }

    .status-image-slot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      overflow: hidden;
    }

    .status-image-slot img,
    .status-image-slot svg {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      image-rendering: auto;
    }

    .status-extra-slot {
      width: 18px;
      height: 18px;
    }

    .status-search-slot {
      width: 19px;
      height: 19px;
    }

    .status-muted-slot {
      width: 20px;
      height: 20px;
    }

    .status-volte-slot {
      width: 18px;
      height: 18px;
    }

    .status-signal-slot {
      width: 21px;
      height: 17px;
    }

    .status-battery-slot {
      width: 22px;
      height: 15px;
    }


    .status-icons-group {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      overflow: hidden;
    }

    .status-icons-group img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    .status-left-icons {
      width: 51px;
      height: 30px;
      margin-left: 0;
    }

    .status-right-icons {
      width: 94px;
      height: 31px;
      margin-right: 1px;
    }


    .status-battery-svg {
      width: 19px;
      height: 23px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      overflow: visible;
      transform: translateY(-1px);
    }

    .status-battery-svg svg {
      width: 19px;
      height: 23px;
      display: block;
      overflow: visible;
    }

    .network-type {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: -.2px;
    }

    .battery-percent {
      font-size: 23px;
      font-weight: 400;
      letter-spacing: -.5px;
    }

    .app-header {
      height: 71px;
      display: grid;
      grid-template-columns: 70px 1fr 70px 70px;
      align-items: center;
      padding: 0 20px 0 18px;
    }
.header-image-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex: 0 0 auto;
    }

    .header-image-icon img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .header-back-icon {
      width: 36px;
      height: 37px;
      justify-self: start;
    }

    .header-search-icon {
      width: 42px;
      height: 42px;
      justify-self: center;
    }

    .header-analytics-icon {
      width: 44px;
      height: 45px;
      justify-self: end;
    }

    .title {
      font-size: 29px;
      font-weight: 500;
      letter-spacing: -.4px;
    }
.filters {
      height: 82px;
      display: flex;
      align-items: start;
      gap: 12px;
      padding: 7px 24px 0;
    }

    .filter {
      height: 46px;
      border: 0;
      border-radius: 25px;
      padding: 0 16px;
      background: #292929;
      color: #f2f2f2;
      font-family: inherit;
      font-size: 18px;
      font-weight: 500;
      white-space: nowrap;
    }

    .filter.blue {
      background: #579df5;
      padding-left: 17px;
      padding-right: 14px;
    }

    .summary {
      height: 145px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      padding: 8px 24px 0;
    }

    .summary-card {
      height: 110px;
      border-radius: 31px;
      background: #1e1e20;
      padding: 24px 29px;
    }

    .summary-value {
      font-size: 24px;
      font-weight: 500;
      letter-spacing: .3px;
    }

    .summary-label {
      margin-top: 8px;
      font-size: 20px;
      font-weight: 400;
    }

    .transactions {
      position: absolute;
      left: 0;
      right: 0;
      top: 323px;
      bottom: 0;
      overflow: hidden;
      padding-bottom: 74px;
      opacity: 1;
    }

    .transaction {
      height: 120px;
      display: grid;
      grid-template-columns: 84px 1fr 205px;
      align-items: center;
      padding: 0 24px;
    }

    .transaction-icon {
      width: 64px;
      height: 65px;
      object-fit: cover;
      border-radius: 50%;
    }

    .transaction-title {
      font-size: 23px;
      font-weight: 500;
      line-height: 1.15;
      white-space: nowrap;
    }

    .transaction-subtitle {
      margin-top: 6px;
      color: #8c8c91;
      font-size: 20px;
      white-space: nowrap;
    }

    .transaction-side {
      text-align: right;
      min-width: 0;
    }

    .amount {
      font-size: 24px;
      font-weight: 400;
      line-height: 1.1;
      white-space: nowrap;
    }

    .amount.expense { color: #f04e58; }
    .amount.income { color: #25d45b; }

    .account {
      margin-top: 8px;
      color: #929297;
      font-size: 18px;
      white-space: nowrap;
      overflow: hidden;
    }


    .android-nav {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 74px;
      background: rgba(10, 10, 10, 0.48);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      z-index: 30;
      pointer-events: none;
    }

    .android-nav-button {
      position: absolute;
      bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .android-nav-button img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .android-recents {
      left: 107px;
      width: 32px;
      height: 35px;
    }

    .android-home {
      left: 269px;
      width: 33px;
      height: 33px;
      bottom: 16px;
    }

    .android-back {
      right: 109px;
      width: 31px;
      height: 35px;
    }

    .copy-button {
      min-width: 175px;
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: linear-gradient(135deg,#e0e0e0,#cfcfcf);
      color: #333;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    .copy-button.copied {
      background: #0a6305;
      color: #fff;
    }

    @media (max-width: 1000px) {
      .workspace,
      .workspace.custom-mode {
        grid-template-columns: 1fr;
      }

      .control-panel,
      .workspace.custom-mode .control-panel {
        width: 100%;
        max-height: none;
      }

      .preview-area {
        order: -1;
      }
    }
  
    /* Уточнённая типографика экрана телефона */
    .phone-screen {
      font-weight: 400;
    }

    .phone-screen .title,
    .phone-screen .filter,
    .phone-screen .summary-value,
    .phone-screen .transaction-title,
    .phone-screen .network-type {
      font-weight: 500;
    }

    .phone-screen .summary-label,
    .phone-screen .transaction-subtitle,
    .phone-screen .amount,
    .phone-screen .account,
    .phone-screen .status-time,
    .phone-screen .battery-percent {
      font-weight: 400;
    }


    /* Типографика, максимально близкая к Samsung One UI */
    .phone-screen {
      font-family: "Roboto", "Segoe UI", Arial, sans-serif;
      font-feature-settings: "kern" 1, "liga" 1;
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      letter-spacing: -0.18px;
    }

    .phone-screen .status-time,
    .phone-screen .battery-percent {
      letter-spacing: -0.45px;
    }

    .phone-screen .title {
      letter-spacing: -0.55px;
    }

    .phone-screen .filter {
      letter-spacing: -0.25px;
    }

    .phone-screen .summary-value,
    .phone-screen .amount {
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.2px;
    }

    .phone-screen .summary-label,
    .phone-screen .transaction-subtitle,
    .phone-screen .account {
      letter-spacing: -0.12px;
    }

    .phone-screen .transaction-title {
      letter-spacing: -0.28px;
    }


    .transaction {
      position: relative;
      z-index: 1;
      cursor: pointer;
      background: transparent !important;
      transition: none;
      opacity: 1 !important;
      filter: none !important;
    }

    .transaction:hover,
    .transaction:active,
    .transaction:focus {
      background: transparent !important;
      opacity: 1 !important;
      filter: none !important;
    }

    .transaction-editor {
      scroll-margin-top: 18px;
      transition:
        border-color .25s ease,
        background-color .25s ease,
        box-shadow .25s ease,
        transform .25s ease;
    }

    .transaction-editor.editor-highlight {
      border-color: #579df5;
      background: #26384d;
      box-shadow:
        0 0 0 3px rgba(87, 157, 245, .22),
        0 0 24px rgba(87, 157, 245, .22);
      transform: scale(1.012);
    }

    .built-in-template-note {
      color: #8f8f8f;
      font-size: 11px;
      line-height: 1.35;
    }


    .date-separator {
      position: relative;
      z-index: 1;
      height: 82px;
      display: flex;
      align-items: flex-end;
      padding: 0 24px 14px;
      margin: 0;
      color: #f1f1f1;
      background: transparent !important;
      font-size: 27px;
      font-weight: 500;
      letter-spacing: -0.35px;
      cursor: pointer;
      opacity: 1 !important;
      filter: none !important;
      transition: none;
    }

    .date-separator:hover,
    .date-separator:active,
    .date-separator:focus {
      background: transparent !important;
      opacity: 1 !important;
      filter: none !important;
    }

    .separator-editor {
      border-style: dashed;
    }


    .transactions .transaction,
    .transactions .transaction *,
    .transactions .date-separator {
      opacity: 1;
      filter: none;
    }


    .transactions .transaction::before,
    .transactions .transaction::after,
    .transactions .date-separator::before,
    .transactions .date-separator::after {
      display: none !important;
      content: none !important;
    }

    .transactions .transaction-title,
    .transactions .transaction-subtitle,
    .transactions .amount,
    .transactions .account,
    .transactions .transaction-icon {
      opacity: 1 !important;
      filter: none !important;
      mix-blend-mode: normal !important;
    }


    .android-nav-button {
      z-index: 2;
    }

    .android-nav-button img {
      opacity: 1;
      filter: none;
    }


    .demo-watermark {
      position: absolute;
      inset: 0;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      user-select: none;
      transform: rotate(-24deg);
      transform-origin: center;
      text-align: center;
    }

    .demo-watermark-main {
      color: rgba(255,255,255,.13);
      font-size: 66px;
      font-weight: 500;
      letter-spacing: 7px;
      line-height: 1;
    }

    .demo-watermark-sub {
      margin-top: 14px;
      max-width: 470px;
      color: rgba(255,255,255,.11);
      font-size: 21px;
      font-weight: 500;
      letter-spacing: 1.5px;
      line-height: 1.35;
    }

</style>
</head>

<body>
  <main class="workspace" id="workspace">
    <aside class="control-panel">
      <h1 class="panel-title">Генератор экрана</h1>

      <section class="section">
        <h2 class="section-title">Основные данные</h2>

        <div class="field">
          <label class="switch-line">
            <input id="customMonthCheckbox" type="checkbox">
            <span>Свой месяц</span>
          </label>
        </div>

        <div class="field" id="customMonthField" style="display:none;">
          <label for="monthInput">Месяц</label>
          <input class="input" id="monthInput" value="Июль">
        </div>

        <div class="field">
          <label for="actressSelect">Актриса</label>
          <select class="select" id="actressSelect">
            <option value="Мария">Мария</option>
            <option value="Валерия">Валерия</option>
            <option value="Полина">Полина</option>
          </select>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="expensesInput">Траты</label>
            <input class="input" id="expensesInput" value="36 977 ₽">
          </div>
          <div class="field">
            <label for="incomeInput">Доходы</label>
            <input class="input" id="incomeInput" value="37 451 ₽">
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="filter2Input">Второй фильтр</label>
            <input class="input" id="filter2Input" value="Счета и карты">
          </div>
          <div class="field">
            <label for="filter3Input">Третий фильтр</label>
            <input class="input" id="filter3Input" value="Без переводов">
          </div>
        </div>

        <div class="field">
          <label class="switch-line">
            <input id="customTimeCheckbox" type="checkbox">
            <span>Своё время</span>
          </label>
        </div>

        <div class="field-row">
          <div class="field" id="customTimeField" style="display:none;">
            <label for="statusTimeInput">Время телефона</label>
            <input class="input" id="statusTimeInput" value="19:59" maxlength="5" placeholder="19:59">
          </div>
          <div class="field">
            <label for="batteryPercentInput">% заряда</label>
            <input class="input" id="batteryPercentInput" value="39%" inputmode="text" maxlength="4" placeholder="Например 50%">
          </div>
        </div>

        
      </section>

      <section class="section">
        <h2 class="section-title">Шаблоны</h2>
        <div id="builtInTemplateList" class="template-list"></div>
        <div class="built-in-template-note">Сегодня: шаблон → Магнит → вчерашняя дата → прошлые операции</div>
        <div id="templateList" class="template-list"></div>

        <div class="field">
          <label for="templateNameInput">Название нового шаблона</label>
          <input class="input" id="templateNameInput" placeholder="Например: Шаблон 1">
        </div>

        <button class="button primary" id="saveTemplateBtn" type="button">
          Сохранить текущий экран как шаблон
        </button>
      </section>

      <section class="section">
        <label class="switch-line">
          <input id="customScreenCheckbox" type="checkbox">
          <span>Свой экран</span>
        </label>
      </section>

      <div class="custom-editor">
        <section class="section">
          <h2 class="section-title">Настройка каждого перевода</h2>
          <div id="transactionsEditor"></div>
          <div class="field-row">
            <button class="button" id="addTransactionBtn" type="button">
              Добавить перевод
            </button>
            <button class="button" id="addSeparatorBtn" type="button">
              Добавить разделитель
            </button>
          </div>
        </section>
      </div>
    </aside>

    <section class="preview-area">
      <div class="preview-wrapper">
        <div class="phone-screen screen-preview" id="preview-screen">
          
          
          <div class="status-bar" id="statusBar">
            <div class="status-left">

      function clone(value) {
        return JSON.parse(JSON.stringify(value));

      function shuffledNames() {
        const items = [...RANDOM_NAMES];
        for (let i = items.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [items[i], items[j]] = [items[j], items[i]];
        }
        return items;
      }

      function randomizeNamesBeforeSeparator(items) {
        const names = shuffledNames();
        let nameIndex = 0;

        for (const item of items) {
          if (item.kind === 'separator') break;
          if (item.name === 'Магнит' || item.name === 'Вкусно — и точка') continue;
          item.name = names[nameIndex % names.length];
          nameIndex += 1;
        }

        return items;
      }

      function randomizeNamesAfterSeparator(items) {
        const names = shuffledNames();
        let nameIndex = 0;
        let afterSeparator = false;

        for (const item of items) {
          if (item.kind === 'separator') {
            afterSeparator = true;
            continue;
          }
          if (!afterSeparator) continue;
          if (item.name === 'Вкусно — и точка' || item.name === 'Магнит') continue;
          item.name = names[nameIndex % names.length];
          nameIndex += 1;
        }

        return items;
      }

      function getCurrentRussianMonth() {
        const month = new Intl.DateTimeFormat('ru-RU', {
          timeZone: 'Europe/Moscow',
          month: 'long'
        }).format(new Date());

        return month.charAt(0).toUpperCase() + month.slice(1);
      }

      function getYesterdayLabel() {
        const nowInMoscow = new Date(
          new Date().toLocaleString('en-US', { timeZone: 'Europe/Moscow' })
        );
        nowInMoscow.setDate(nowInMoscow.getDate() - 1);

        const monthsGenitive = [
          'января',
          'февраля',
          'марта',
          'апреля',
          'мая',
          'июня',
          'июля',
          'августа',
          'сентября',
          'октября',
          'ноября',
          'декабря'
        ];

        const day = nowInMoscow.getDate();
        const month = monthsGenitive[nowInMoscow.getMonth()];

        return `${day} ${month}`;
      }

      function normalizeAmount(value, type) {
        let clean = String(value || '').trim();
        if (!clean) return type === 'income' ? '+0 ₽' : '−0 ₽';
        clean = clean.replace(/^[+−-]\s*/, '');
        return (type === 'income' ? '+' : '−') + clean;

        el.batteryPercentOutput.textContent = Math.round(batteryValue) + '%';

      function openTransactionEditor(index) {
        if (!Number.isInteger(index) || index < 0 || index >= state.transactions.length) return;

        if (!el.customScreenCheckbox.checked) {
          el.customScreenCheckbox.checked = true;
          el.workspace.classList.add('custom-mode');
        }

        renderTransactionsEditor();

        requestAnimationFrame(() => {
          const editor = el.transactionsEditor.querySelector(
            `.transaction-editor[data-transaction-index="${index}"]`
          );

          if (!editor) return;

          editor.scrollIntoView({
            behavior: 'smooth',
            block: 'center'
          });

          editor.classList.remove('editor-highlight');
          void editor.offsetWidth;
          editor.classList.add('editor-highlight');

          window.setTimeout(() => {
            editor.classList.remove('editor-highlight');
          }, 2600);
        });
      }

          updateAutomaticMoscowTime();
        } else {
          state.statusTime = el.statusTimeInput.value || getMoscowTime();
          renderScreen();
          saveAppState();
        }
      });

      el.statusTimeInput.addEventListener('input', event => {
        if (!state.customTime) return;
        state.statusTime = event.target.value;
        renderScreen();
        saveAppState();
      });

      el.customScreenCheckbox.addEventListener('change', () => {
        el.workspace.classList.toggle('custom-mode', el.customScreenCheckbox.checked);
      });

      el.addTransactionBtn.addEventListener('click', () => {
        state.transactions.push({
          name: 'Новый перевод',
          subtitle: 'Переводы',
          amount: '1 000 ₽',
          type: 'income',
          account: 'Дебетовая карта',
          avatar: 'check'
        });
        renderTransactionsEditor();
        renderScreen();
        saveAppState();
      });

      el.addSeparatorBtn.addEventListener('click', () => {
        state.transactions.push({
          kind: 'separator',
          label: '5 июля'
        });
        renderTransactionsEditor();
        renderScreen();
        saveAppState();

        requestAnimationFrame(() => {
          openTransactionEditor(state.transactions.length - 1);
        });
      });

      el.saveTemplateBtn.addEventListener('click', () => {
        const name = el.templateNameInput.value.trim();
        if (!name) {
          alert('Введите название шаблона.');
          return;
        }

        const templates = getTemplates();
        templates.push({ name, state: clone(state) });
        saveTemplates(templates);
        el.templateNameInput.value = '';
        renderTemplates();
      });

      async function createScreenCanvas() {
        el.exportScreen.innerHTML = el.previewScreen.innerHTML;
        return html2canvas(el.exportScreen, {
          width: 574,
          height: 1280,
          scale: window.devicePixelRatio || 1,
          backgroundColor: '#111111',
          useCORS: true,
          logging: false
        });
      }

      el.copyBtn.addEventListener('click', async () => {
        try {
          const canvas = await createScreenCanvas();
          canvas.toBlob(async blob => {
            if (!blob) throw new Error('Не удалось создать изображение');
            await navigator.clipboard.write([
              new ClipboardItem({ 'image/png': blob })
            ]);

            el.copyBtn.textContent = 'Скопировано';
            el.copyBtn.classList.add('copied');

            setTimeout(() => {
              el.copyBtn.textContent = 'Скопировать скриншот';
              el.copyBtn.classList.remove('copied');
            }, 1800);
          }, 'image/png');
        } catch (error) {
          console.error(error);
          alert('Не удалось скопировать скриншот. Открой файл через localhost или HTTPS.');
        }
      });

      const savedState = loadAppState();
      if (savedState) {
        state = savedState;
      } else {
        const initialTemplate = BUILT_IN_TEMPLATES.find(template => template.name === '1001');
        if (initialTemplate) {
          state.transactions = buildTemplateScreen(initialTemplate.transactions);
        }
      }

      if (!state.customMonth) {
        state.month = getCurrentRussianMonth();
      }

      if (!state.customTime) {
        state.statusTime = getMoscowTime();
      }

      applyActressToTransactions(false);
      syncMainInputs();
      updateAutomaticMoscowTime();
      setInterval(updateAutomaticMoscowTime, 1000);

      renderTransactionsEditor();
      renderBuiltInTemplates();
      renderTemplates();
      renderScreen();
      saveAppState();

      window.OperationsGenerator = {
        getState: () => clone(state),
        setState: value => {
          state = clone(value);
          syncMainInputs();
          renderTransactionsEditor();
          renderScreen();
        },
        createScreenCanvas,
        openTransactionEditor,
        applyBuiltInTemplate
      };
    })();
  </script>
</body>
</html>
